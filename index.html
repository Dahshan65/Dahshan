<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رواق الخط العربي / وائل دهشان</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f4c3a;
            --primary-dark: #0a3327;
            --primary-light: #166e54;
            --accent: #c59b27;
            --accent-light: #e0b84c;
            --accent-soft: #fcf8ee;
            --bg-body: #f8faf9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(15, 76, 58, 0.08);
            --radius-md: 14px;
            --radius-sm: 8px;
            --transition: all 0.25s ease;
        }

        body.dark-theme {
            --bg-body: #111827;
            --card-bg: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --accent-soft: #2c2514;
            --shadow-md: 0 4px 15px rgba(0,0,0,0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .calligraphy-title {
            font-family: 'Amiri', serif;
        }

        /* Top Header */
        header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: #ffffff;
            padding: 1.2rem 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-icon {
            font-size: 2.2rem;
            color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(197, 155, 39, 0.4);
        }

        .brand-text h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .brand-text p {
            font-size: 0.85rem;
            color: var(--accent-light);
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            border: none;
            outline: none;
            cursor: pointer;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: #1f2937;
        }

        .btn-accent:hover {
            box-shadow: 0 4px 14px rgba(197, 155, 39, 0.4);
            transform: translateY(-2px);
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            width: 42px;
            height: 42px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.25);
            color: var(--accent-light);
        }

        /* Main Workspace Layout */
        .main-wrapper {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 390px;
            gap: 2rem;
            flex-grow: 1;
        }

        @media (max-width: 1024px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }
        }

        /* Video Showcase Area */
        .video-container-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .video-viewport {
            width: 100%;
            position: relative;
            background: #000000;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }

        .video-viewport iframe,
        .video-viewport video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-meta-box {
            padding: 1.8rem;
        }

        .badge-category {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid rgba(197, 155, 39, 0.3);
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .video-meta-box h2 {
            font-size: 1.6rem;
            color: var(--text-main);
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }

        .lesson-notes-card {
            background: var(--accent-soft);
            border-right: 4px solid var(--accent);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 1.2rem;
            margin-top: 1.2rem;
            font-size: 0.98rem;
            line-height: 1.8;
            color: var(--text-main);
        }

            color: var(--accent);
            margin-bottom: 0.5rem;
            display
